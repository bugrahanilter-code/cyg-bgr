name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .
        continue-on-error: true

      - name: Type check (mypy)
        # Advisory while the type coverage grows. Make it blocking once the
        # codebase is fully annotated.
        run: mypy app
        continue-on-error: true

      - name: Tests (pytest)
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:///:memory:
          SECRET_KEY: ci-secret-key-not-used-anywhere-else
          ENABLE_BACKGROUND_ENGINE: "false"
          LIVE_TRADING_ENABLED: "false"
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build:app

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build -f docker/backend.Dockerfile -t trading-backend:ci .

      - name: Build the frontend image
        run: docker build -f docker/frontend.Dockerfile -t trading-frontend:ci .

  security:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "A .env file is tracked by git. Remove it and rotate every key it contained."
            exit 1
          fi
          echo "No tracked .env file."

      - name: Look for obvious hard-coded secrets
        run: |
          if grep -rInE "(api_secret|apiSecret|BINANCE_API_SECRET)\s*[:=]\s*[\"'][A-Za-z0-9]{16,}" \
             --include="*.py" --include="*.ts" --include="*.tsx" --include="*.yml" . ; then
            echo "A hard-coded secret appears to be present."
            exit 1
          fi
          echo "No hard-coded secrets found."
